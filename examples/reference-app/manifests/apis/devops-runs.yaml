apiVersion: traceable.dev/v1
kind: Api
metadata:
  name: devops-runs
  description: >-
    Lists every job run, newest first, with how long it took and what it cost.
    Opening a run shows its steps one by one, including the decisions and the
    reasons given for them.
  owner: platform
spec:
  service: devops
  method: GET
  path: /devops/runs
  auth: secured
  handler: src/devops/pages/devops-runs.ts
  response:
    description: An HTML page in the DevOps UI.
  data:
    reads: [runs, run_steps]
    writes: []
    must_not_touch: [users]
